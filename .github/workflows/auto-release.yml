# 自动发布工作流
# 当 pyproject.toml 中的版本号变化时，自动创建 Tag 和 Release
#
# 使用方法：
# 1. 修改 pyproject.toml 中的 version
# 2. 同步修改 web/package.json 中的 version
# 3. 提交并推送到 main 分支
# 4. 工作流自动检测版本变化，创建 Tag 和 Release

name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.check.outputs.changed }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # 获取前一个 commit 用于比较
      
      - name: Get current version
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Check if version changed
        id: check
        run: |
          # 获取上一个 commit 的版本号
          git show HEAD~1:pyproject.toml > /tmp/old_pyproject.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/old_pyproject.toml
          OLD_VERSION=$(grep -m1 'version = ' /tmp/old_pyproject.toml | sed 's/version = "\(.*\)"/\1/' || echo "0.0.0")
          
          echo "Old version: $OLD_VERSION"
          echo "New version: ${{ steps.version.outputs.version }}"
          
          if [ "$OLD_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version not changed"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 获取完整历史用于生成 changelog
      
      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION="v${{ needs.check-version.outputs.version }}"
          
          echo "## 🚀 $VERSION" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Released on $(date +'%Y-%m-%d')" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          if [ -n "$LAST_TAG" ]; then
            echo "### 📝 Changes since $LAST_TAG" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            
            # 获取 commit 列表，按类型分组
            echo "#### ✨ Features" >> CHANGELOG.md
            git log $LAST_TAG..HEAD --pretty=format:"- %s" --grep="^feat" >> CHANGELOG.md || true
            echo "" >> CHANGELOG.md
            
            echo "#### 🐛 Bug Fixes" >> CHANGELOG.md
            git log $LAST_TAG..HEAD --pretty=format:"- %s" --grep="^fix" >> CHANGELOG.md || true
            echo "" >> CHANGELOG.md
            
            echo "#### 📚 Other Changes" >> CHANGELOG.md
            git log $LAST_TAG..HEAD --pretty=format:"- %s" | head -20 >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          else
            echo "### 🎉 Initial Release" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s" | head -20 >> CHANGELOG.md
          fi
          
          cat CHANGELOG.md
      
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.version, 'alpha') || contains(needs.check-version.outputs.version, 'beta') || contains(needs.check-version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 触发 Docker 构建
  trigger-docker-build:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.version_changed == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit
