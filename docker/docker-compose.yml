# Docker Compose 配置示例
# 需要已有 PostgreSQL 数据库（启用 pgvector 扩展）
#
# 使用方式：
# curl -O https://raw.githubusercontent.com/127Wzc/ImgTag/main/docker/docker-compose.yml
# 然后编辑 environment 中的数据库连接，执行 docker-compose up -d

services:
  imgtag:
    image: 127wzc/imgtag:latest
    container_name: imgtag
    ports:
      # 全栈版统一端口（前端 + 后端 API）
      - "5173:8000"
    environment:
      # 必填：PostgreSQL 连接字符串
      - PG_CONNECTION_STRING=postgresql://user:password@host:5432/imgtag
      # 修改后需重新创建容器生效；可在 Compose 的 .env 中覆盖默认值
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-0}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-600}
      - DB_POOL_PRE_PING=${DB_POOL_PRE_PING:-true}
      - STORAGE_SYNC_CONCURRENCY=${STORAGE_SYNC_CONCURRENCY:-2}
      - STORAGE_SYNC_DB_MAX_ATTEMPTS=${STORAGE_SYNC_DB_MAX_ATTEMPTS:-5}
      - STORAGE_SYNC_DB_RETRY_DELAY=${STORAGE_SYNC_DB_RETRY_DELAY:-2}
    volumes:
      # 统一数据目录（所有本地存储 bucket 都在此目录下）
      # 例如：./data/uploads, ./data/test, ./data/images 等
      - ./data:/app/data
      # 本地嵌入模型目录（可选，支持离线运行）
      # 预置模型后容器启动时无需联网下载
      - ./models:/app/models
    restart: unless-stopped
